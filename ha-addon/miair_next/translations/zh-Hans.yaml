configuration:
  host_ip:
    name: "局域网 IP 覆盖"
    description: "留空时自动从 HAOS 默认路由网卡获取局域网 IPv4（推荐）。只有自动选择错误时才手动填写，例如 192.168.1.20。该地址用于让小爱音箱回连 MiAir Next 的音频流。"
  airplay_stream_format:
    name: "AirPlay 下游音频格式"
    description: "auto（推荐）按音箱型号选择；S12A 和已知 WAV 兼容性较差的型号优先使用 MP3，其他型号继续使用低延迟 WAV。若仍无声，可手动强制 MP3 或 WAV 做 A/B 测试。"
